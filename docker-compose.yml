services:
  app:
    build: .
    container_name: ast-app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ast_db}
      - DB_USER=${DB_USER:-ast_app_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public:/app/public:ro
      - ./src:/app/src:ro
    networks:
      - ast-network

  db:
    image: postgres:15-alpine
    container_name: ast-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_ROOT_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-ast_db}
      - APP_DB_USER=${DB_USER:-ast_app_user}
      - APP_DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 01_schema cria tabelas e índices
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      # 02_init_user cria o usuário ast_app_user dinamicamente com a senha do .env
      - ./scripts/init_user.sh:/docker-entrypoint-initdb.d/02_init_user.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ast-network

volumes:
  postgres_data:

networks:
  ast-network:
    driver: bridge
